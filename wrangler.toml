name = "license-server"
main = "src/index.js"
compatibility_date = "2024-06-01"

# اتصال به دیتابیس D1 (برای لایسنس‌های دائمی)
[[d1_databases]]
binding = "DB"
database_name = "license-db"
database_id = "YOUR_D1_DATABASE_ID"  # بعد از ساخت D1 جایگزین کنید

# اتصال به KV (برای توکن‌های یکبارمصرف و کش)
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "YOUR_KV_NAMESPACE_ID"  # بعد از ساخت KV جایگزین کنید
